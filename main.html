<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kish-MD | Session</title>
    <meta property="og:image" content="https://i.imgur.com/3cMVKBk.jpeg">
    <meta property="og:title" content="Brasho Kish">
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 75vh;
        flex-direction: column;
        background: #000;
      }
      #main {
        text-align: center;
      }
      h1 {
        font-size: 200%;
        color: #ffffff;
      }
      h3 {
        font-weight: 200;
        color: #ffffff;
      }
      h1, h3 {
        letter-spacing: 0.05em;
      }
      #clock {
        font-size: 24px;
        color: #fff;
        margin-top: 20px;
      }
      .button {
        width: 150px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0px 15px;
        background-color: red;
        border-radius: 10px;
        border: none;
        color: white;
        cursor: pointer;
        font-weight: 900;
        background: linear-gradient(0deg, #000, #272727);
        margin: 10px;
      }
      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background-color: #000;
        text-align: center;
        padding: 10px;
        color: #333;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="main">
      <h1 class="h">
        Select <br> An Option
      </h1>
      <div id="clock"></div>
      <button onclick="window.open('/pair')" class="button">PAIR CODE</button>
      <button onclick="location.href='https://kish-web-qr.onrender.com/'" class="button">SCAN QR</button>
    </div>
    <footer>
      <p>Brashokish</p>
    </footer>

    <script>
      function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const timeString = `${hours}:${minutes}:${seconds}`;
        document.getElementById('clock').textContent = timeString;
      }
      setInterval(updateClock, 1000);
      updateClock(); // Initialize clock immediately
    </script>
  </body>
</html>
