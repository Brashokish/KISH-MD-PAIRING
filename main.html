<!DOCTYPE html>
<html lang="en">

  <head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kish-MD | Session</title>
    <meta property="og:image" content="https://i.imgur.com/3cMVKBk.jpeg">
    <meta property="og:title" content="Brasho Kish">

    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 75vh;
        flex-direction: column;
        background: #000;
        position: relative;
      }

      #main {
        text-align: center;
      }

      h1 {
        font-size: 200%;
        color: #ffffff;
      }

      h3 {
        font-weight: 200;
        color: #ffffff;
      }

      h1, h3 {
        letter-spacing: 0.05em;
      }

      .h {
        font-family: "Montserrat Medium";
        max-width: 40ch;
        color: #ffffff;
        position: relative;
        text-align: top;
        transform: scale(0.94);
        animation: scale 3s forwards cubic-bezier(0.5, 1, 0.89, 1);
      }

      @keyframes scale {
        100% {
          transform: scale(1);
        }
      }

      span {
        display: inline-block;
        opacity: 0;
        filter: blur(4px);
      }

      span:nth-child(1) {
        animation: fade-in 0.8s 0.1s forwards cubic-bezier(0.11, 0, 0.5, 0);
      }

      @keyframes fade-in {
        100% {
          opacity: 1;
          filter: blur(0);
        }
      }

      .btn {
        --border-color: linear-gradient(-45deg, #ffae00, #7e03aa, #00fffb);
        --border-width: .125em;
        --curve-size: .5em;
        --blur: 30px;
        --bg: #080312;
        --color: #afffff;
        color: var(--color);
        position: relative;
        isolation: isolate;
        display: inline-grid;
        text-align: center;
        place-content: center;
        padding: .5em 1.5em;
        font-size: 17px;
        border: 0;
        text-transform: uppercase;
        box-shadow: 10px 10px 20px rgba(0, 0, 0, .6);
        clip-path: polygon(0% var(--curve-size), var(--curve-size) 0, 100% 0, 100% calc(100% - var(--curve-size)), calc(100% - var(--curve-size)) 100%, 0 100%);
        transition: color 250ms;
      }

      .btn::after,
      .btn::before {
        content: '';
        position: absolute;
        inset: 0;
      }

      .btn::before {
        background: var(--border-color);
        background-size: 300% 300%;
        animation: move-bg7234 5s ease infinite;
        z-index: -2;
      }

      @keyframes move-bg7234 {
        0% {
          background-position: 31% 0%
        }
        50% {
          background-position: 70% 100%
        }
        100% {
          background-position: 31% 0%
        }
      }

      .btn::after {
        background: var(--bg);
        z-index: -1;
        clip-path: polygon(0% var(--curve-size), var(--curve-size) 0, 100% 0, 100% calc(100% - var(--curve-size)), calc(100% - var(--curve-size)) 100%, 0 100%);
        transition: clip-path 500ms;
      }

      .button {
        width: 150px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0px 15px;
        background-color: red;
        border-radius: 10px;
        border: none;
        color: white;
        position: relative;
        cursor: pointer;
        font-weight: 900;
        transition-duration: .2s;
        background: linear-gradient(0deg, #000, #272727);
        left: 70px;
      }

      .button:before, .button:after {
        content: '';
        position: absolute;
        left: -2px;
        top: -2px;
        border-radius: 10px;
        background: linear-gradient(45deg, #fb0094, #0000ff, #00ff00, #ffff00, #ff0000, #fb0094, #0000ff, #00ff00, #ffff00, #ff0000);
        background-size: 400%;
        width: calc(100% + 4px);
        height: calc(100% + 4px);
        z-index: -1;
        animation: steam 20s linear infinite;
      }

      @keyframes steam {
        0% {
          background-position: 0 0;
        }
        50% {
          background-position: 400% 0;
        }
        100% {
          background-position: 0 0;
        }
      }

      .button:after {
        filter: blur(50px);
      }

      footer {
        position: relative;
        text-align: center;
        padding: 10px;
        color: #333;
        font-size: 14px;
        margin-top: 20px; /* Added margin to ensure space for the footer */
        z-index: 10; /* Ensure it's above other content */
      }

      #clock {
        font-size: 24px;
        color: #fff;
        font-family: 'Montserrat', sans-serif;
        position: fixed;
        bottom: 10px; /* Positioned at the bottom */
        left: 50%;
        transform: translateX(-50%);
        margin-top: 50px; /* Ensure it’s not overlapping with footer */
        z-index: 20; /* Keep it above other content */
      }

    </style>

  </head>

  <body>

    <div id="main">
      <br><br>
      <h1 class="h">
        <center>
          <span>Select <span>
          <span>An <span>
          <span>Option <span>
        </center>
      </h1>

      <h3 class="h">
        <span><span>
      </span></span></h3>

      <input hidden type="text" name="value" value="Kish-MD">
      <br><br>

      <button onclick="window.open(`/pair`)" class="button">PAIR CODE</button>
      <br><br>
      <button onclick="location.href='https://kish-web-qr.onrender.com/'" class="button">SCAN QR</button>

    </div>

    <footer>
      <p>Brashokish</p>
    </footer>

    <div id="clock"></div> <!-- Real-time clock will appear here -->

    <script>
      // Function to display current time
      function updateTime() {
        const now = new Date();
        const hours = now.getHours().toString().padStart(2, '0');
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const seconds = now.getSeconds().toString().padStart(2, '0');
        const time = `${hours}:${minutes}:${seconds}`;
        
        // Update the clock in the DOM
        document.getElementById('clock').innerText = time;
      }

      // Update the clock every second
      setInterval(updateTime, 1000);
      updateTime(); // Call initially to show time without delay
    </script>

  </body>

</html>
